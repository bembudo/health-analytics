name: Release Daemon

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to create releases and upload files
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binaries
        run: |
          mkdir -p build
          
          echo "Building for Linux AMD64..."
          GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o build/health-analytics-linux-amd64 main.go
          
          echo "Building for Linux ARM64..."
          GOOS=linux GOARCH=arm64 go build -ldflags="-s -w" -o build/health-analytics-linux-arm64 main.go
          
          echo "Building for Linux ARMv7..."
          GOOS=linux GOARCH=arm GOARM=7 go build -ldflags="-s -w" -o build/health-analytics-linux-armv7 main.go

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v3
        with:
          files: build/*
          generate_release_notes: true
